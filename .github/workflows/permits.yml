name: North Carolina permit refresh and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nc-permit-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualification, pagination and sales-detail tests
        id: tests
        run: python src/run_tests_with_status.py
      - name: Commit CI diagnostics if tests fail
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ci_test_status.json
          git diff --staged --quiet || git commit -m "Record NC CI test failure diagnostics"
          git push
      - name: Collect official municipal and county sources
        run: python src/collect.py
      - name: Probe additional official source schemas (read-only)
        run: python src/probe_sources.py
      - name: Read-only Wake/Brunswick pilot and official-source permit rechecks
        run: python src/validate_chunk8.py
      - name: Wake planning jurisdiction and Brunswick new-home review (read-only)
        run: python src/validate_chunk10.py
      - name: Wake permit-authority and Brunswick GC checks (read-only)
        run: python src/validate_chunk11.py
      - name: Wake individual-link and Brunswick builder-field checks (read-only)
        run: python src/validate_chunk12.py
      - name: Generate Wake and Brunswick manual review queue (read-only)
        run: python src/review_chunk13.py
      - name: Recheck disabled-county GIS object IDs (read-only)
        run: python src/validate_chunk14.py
      - name: Validate curated review decisions and publish held statuses
        run: python src/compile_reviews.py
      - name: Audit per-record release readiness without source promotion
        run: python src/audit_release_readiness.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/*.xml
          git diff --staged --quiet || git commit -m "Refresh NC public permit intelligence"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
